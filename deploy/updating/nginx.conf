# Stand-in for setmeet.tontaan.tech while the app container restarts (deploys).
# Traefik routes here only when the app's routers are gone: see the `updating` service.
server {
  listen 8080 default_server;
  server_tokens off;
  root /usr/share/nginx/html;
  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control "no-store" always;
  add_header Retry-After 15 always;
  error_page 503 /updating.html;
  location = /updating.html { internal; }
  location / { return 503; }
}
