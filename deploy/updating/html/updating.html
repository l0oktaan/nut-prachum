<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="10">
<title>กำลังอัปเดตระบบ · นัดประชุม</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1a1a1c;--muted:#6b6b70;--neon:#d4ff2b}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f12;--card:#19191d;--text:#ececf0;--muted:#a1a1a8}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font-family:'Leelawadee UI',Tahoma,system-ui,-apple-system,sans-serif;line-height:1.6}
main{width:100%;max-width:440px;text-align:center;background:var(--card);border-radius:24px;padding:36px 24px;box-shadow:0 10px 30px -14px rgba(0,0,0,.18)}
.logo{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;background:var(--neon);display:grid;place-items:center;color:#1a1a1c}
.spin{width:22px;height:22px;margin:0 auto 14px;border:3px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;opacity:.6}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 auto;color:var(--muted);max-width:34ch}
small{display:block;margin-top:18px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg></div>
  <div class="spin" aria-hidden="true"></div>
  <h1>นัดประชุมกำลังอัปเดตระบบ</h1>
  <p>ใช้เวลาไม่เกินหนึ่งนาที หน้านี้จะโหลดใหม่ให้อัตโนมัติ — คำตอบที่บันทึกไว้แล้วไม่หาย</p>
  <small>Set up a meeting · setmeet.tontaan.tech</small>
</main>
</body>
</html>
